# Everything tunable is a ${VAR:-default}: set them in the shell, a CI/CD pipeline, or a .env file (see .env.example).
services:
  bunnysave:
    build: .
    image: ${BUNNYSAVE_IMAGE:-bunnysave:latest}
    container_name: ${CONTAINER_NAME:-bunnysave}
    restart: ${RESTART_POLICY:-unless-stopped}
    # No authentication by design: keep BIND_ADDR on 127.0.0.1 (or your tailnet IP), never 0.0.0.0 on a LAN.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8484}:8484"
    environment:
      TZ: ${TZ:-UTC}
      BUNNYSAVE_SCHEDULER: ${BUNNYSAVE_SCHEDULER:-1}
      # Optional master key for unattended encrypted schedules. Visible in `docker inspect`; prefer the key file below.
      BUNNYSAVE_MASTER_KEY: ${BUNNYSAVE_MASTER_KEY:-}
      BUNNYSAVE_MASTER_KEY_FILE: /run/secrets/bunnysave_master_key
    volumes:
      - ${DATA_DIR:-./data}:/data                      # DB, history, logs, backups/, keys/, gnupg/, known_hosts
      - ${RESTORE_DIR:-./restore}:/restore             # staging area for "restore to local folder"
      # Master key file on the host (ignored while unset: /dev/null is not a regular file)
      - ${MASTER_KEY_FILE:-/dev/null}:/run/secrets/bunnysave_master_key:ro
      # Host filesystem source. Unset = empty dir (the "Host" source stays hidden). HOSTFS_PATH=/ exposes the whole host.
      - ${HOSTFS_PATH:-/var/empty}:/hostfs:${HOSTFS_MODE:-ro}
      # Container sources: mount a host path at the same absolute path inside (set both vars to the same value).
      - ${SOURCE_1:-/dev/null}:${SOURCE_1_AS:-/mnt/unused-1}:${SOURCE_MODE:-ro}
      - ${SOURCE_2:-/dev/null}:${SOURCE_2_AS:-/mnt/unused-2}:${SOURCE_MODE:-ro}
      - ${SOURCE_3:-/dev/null}:${SOURCE_3_AS:-/mnt/unused-3}:${SOURCE_MODE:-ro}
