services:
  bunnysave:
    build: .
    image: bunnysave:latest
    container_name: bunnysave
    restart: unless-stopped
    # No authentication by design: publish on localhost only (or your tailnet IP), never 0.0.0.0 on a LAN.
    ports:
      - "127.0.0.1:8484:8484"
    environment:
      TZ: Europe/Berlin
      # Optional: derive archive passwords from a master key instead of typing them (needed for unattended
      # encrypted schedules). Prefer the file variant so the key is not visible in `docker inspect`.
      # BUNNYSAVE_HOST_ROOT: /hostfs      # default; the Host source appears when this directory exists
      # BUNNYSAVE_MASTER_KEY_FILE: /run/secrets/bunnysave_master_key
    # secrets:
    #   - bunnysave_master_key
    volumes:
      - ./data:/data                       # config DB, history, logs, backups/, keys/, gnupg/, known_hosts
      # Sources: mount at the SAME absolute path as on the host so include globs and restore-to-"/" line up.
      # Read-only is enough for backups; use :rw only for the paths you want "restore to /" to write into.
      - /opt/myapp:/opt/myapp:ro
      # - /home/me/docs:/home/me/docs:ro
      # Whole host filesystem as a "Host" source (paths are entered as on the host). Use :ro for backup-only;
      # drop :ro to allow "restore to original locations" onto the host.
      # - /:/hostfs:ro
      - ./restore:/restore                 # staging area for "restore to sub-directory"
    # Optional: reach Tailscale hosts when the Docker host is on the tailnet but container DNS can't resolve
    # MagicDNS names. Use 100.x.y.z addresses instead, or:
    # network_mode: host   # (then drop `ports:`; the app listens on 0.0.0.0:8484 -> firewall it!)
# secrets:
#   bunnysave_master_key:
#     file: ./master_key.txt
